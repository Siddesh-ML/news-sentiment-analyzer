<!DOCTYPE html>
<html>
<head>
    <title>Stock News Q&A</title>
</head>
<body>
    <h1>📰 AI-Enhanced Stock News</h1>

    {% for article in articles %}
        <hr>
        <h2>{{ article.title }}</h2>
        <p><strong>Sentiment:</strong> {{ article.sentiment }}</p>
        <p><strong>Original Summary:</strong> {{ article.original_summary }}</p>
        <p><strong>AI Summary:</strong> {{ article.generated_summary }}</p>
    {% endfor %}

    <hr>
    <h2>🧠 Ask a Question About a News Article</h2>
    <form action="/ask-question" method="post">
        <label for="article_id">Select a news article:</label><br>
        <select name="article_id" required>
            {% for article in articles %}
                <option value="{{ article.id }}">{{ article.title }}</option>
            {% endfor %}
        </select><br><br>

        <label for="question">Enter your question:</label><br>
        <input type="text" name="question" size="80" required><br><br>

        <input type="submit" value="Get Answer">
    </form>
</body>
</html>
